<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전민하 갤러리 (jeonjinseok)</title>
    
    <!-- Firebase SDK 불러오기 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #161412;
            --container-bg: #221f1c;
            --text-color: #d1c7bd;
            --text-muted: #8c8278;
            --border-color: #3b3530;
            --accent-color: #b85d33;
            --accent-hover: #d06d42;
            --danger-color: #a83232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace, sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 4px;
        }

        header {
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #e2d9d0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        .sub-path {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .admin-btn-area {
            position: absolute;
            top: 0;
            right: 0;
        }

        button {
            background: #2c2723;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--border-color);
            color: #fff;
        }

        .upload-section {
            background: #1a1715;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 3px;
        }

        .upload-section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #c5b8ad;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="file"] {
            background: #12100e;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 2px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        input[type="file"] {
            flex: 1.5;
            min-width: 220px;
            cursor: pointer;
        }

        .upload-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: var(--accent-hover);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            max-width: 350px;
        }

        .search-box input {
            width: 100%;
        }

        .total-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1a1715;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-color: #554c44;
        }

        .card-img-wrap {
            width: 100%;
            height: 180px;
            background: #111;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) sepia(0.1);
        }

        .card-info {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1b18;
            border-top: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #dcd0c4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 2px;
            display: none;
        }

        .delete-btn:hover {
            background: #c23b3b;
        }

        body.admin-mode .delete-btn {
            display: inline-block;
        }

        .admin-badge {
            background: #5a3232;
            color: #ffcccc;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 2px;
            margin-left: 8px;
            display: none;
        }

        body.admin-mode .admin-badge {
            display: inline-block;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>전민하 갤러리 <span class="admin-badge">ADMIN MODE</span></h1>
            <div class="sub-path">path: /jeonjinseok/gallery</div>
            <div class="admin-btn-area">
                <button id="adminToggleBtn" onclick="toggleAdmin()">관리자 로그인</button>
            </div>
        </header>

        <div class="upload-section">
            <h3>+ 사진 아카이브 업로드</h3>
            <div class="form-row">
                <input type="text" id="photoTitle" placeholder="사진 이름 (제목) 입력...">
                <input type="file" id="photoFile" accept="image/*">
                <button class="upload-btn" onclick="uploadPhoto()">업로드</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 사진 이름 검색..." oninput="filterPhotos()">
            </div>
            <div class="total-count" id="totalCount">총 사진: 0장</div>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="no-data">데이터를 불러오는 중...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 여기에 본인의 파이어베이스 설정 정보를 넣으세요
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAkaDwNlJwegTqh7uRtXUMPH8PsCn_T2_0",
  	    authDomain: "jeonjinseok-gallery.firebaseapp.com",
  	    projectId: "jeonjinseok-gallery",
  	    storageBucket: "jeonjinseok-gallery.firebasestorage.app",
  	    messagingSenderId: "98551729936",
  	    appId: "1:98551729936:web:1f58d33b1585dd4b045f95"

        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allPhotos = [];
        let isAdmin = false;

        // 실시간으로 데이터 동기화 (누가 올리거나 지우면 즉시 모든 사람 화면에 반영)
        db.collection("photos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            allPhotos = [];
            snapshot.forEach((doc) => {
                allPhotos.push({ id: doc.id, ...doc.data() });
            });
            filterPhotos();
        });

        // 사진 업로드 (Base64 변환 후 파이어베이스 저장)
        function uploadPhoto() {
            const titleInput = document.getElementById('photoTitle');
            const fileInput = document.getElementById('photoFile');

            const title = titleInput.value.trim();
            if (!title) {
                alert('사진 이름을 입력해 주세요.');
                return;
            }

            if (fileInput.files.length === 0) {
                alert('업로드할 사진 파일을 선택해 주세요.');
                return;
            }

            const file = fileInput.files[0];
            
            // 용량이 너무 큰 사진은 에러가 날 수 있으므로 압축을 위해 리사이징 처리 가능 (여기선 간단히 리더로 변환)
            const reader = new FileReader();

            reader.onload = function(e) {
                const base64Image = e.target.result;

                db.collection("photos").add({
                    title: title,
                    image: base64Image,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    titleInput.value = '';
                    fileInput.value = '';
                    alert('사진이 성공적으로 등록되었습니다!');
                }).catch((error) => {
                    alert('업로드 실패: ' + error.message);
                });
            };

            reader.readAsDataURL(file);
        }

        // 갤러리 화면 그리기
        function renderGallery(list) {
            const grid = document.getElementById('galleryGrid');
            const countElem = document.getElementById('totalCount');
            countElem.innerText = `총 사진: ${list.length}장`;

            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<div class="no-data">등록된 사진이 없습니다.</div>';
                return;
            }

            list.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${photo.image}" alt="${photo.title}">
                    </div>
                    <div class="card-info">
                        <span class="card-title" title="${photo.title}">${photo.title}</span>
                        <button class="delete-btn" onclick="deletePhoto('${photo.id}')">삭제</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 검색 필터링
        function filterPhotos() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPhotos.filter(p => p.title.toLowerCase().includes(keyword));
            renderGallery(filtered);
        }

        // 관리자 모드 토글 (비밀번호: guitar0!)
        function toggleAdmin() {
            if (!isAdmin) {
                const password = prompt('관리자 비밀번호를 입력하세요:');
                if (password === 'guitar0!') { 
                    isAdmin = true;
                    document.body.classList.add('admin-mode');
                    document.getElementById('adminToggleBtn').innerText = '관리자 로그아웃';
                    alert('관리자 모드로 전환되었습니다.');
                } else if (password !== null) {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminToggleBtn').innerText = '관리자 로그인';
                alert('관리자 모드가 해제되었습니다.');
            }
        }

        // 사진 삭제 (서버에서 실시간 삭제)
        function deletePhoto(id) {
            if (!isAdmin) return;
            if (confirm('이 사진을 정말 삭제하시겠습니까?')) {
                db.collection("photos").doc(id).delete().then(() => {
                    // 실시간 리스너에 의해 자동으로 화면이 갱신됩니다.
                }).catch((error) => {
                    alert('삭제 실패: ' + error.message);
                });
            }
        }
    </script>
</body>
</html>
