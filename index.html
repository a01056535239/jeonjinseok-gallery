<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전민하 갤러리 (jeonjinseok)</title>
    
    <!-- Firebase SDK (Modular v9 방식) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        // 파이어베이스 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyAkaDwNlJwegTqh7uRtXUMPH8PsCn_T2_0",
            authDomain: "jeonjinseok-gallery.firebaseapp.com",
            projectId: "jeonjinseok-gallery",
            storageBucket: "jeonjinseok-gallery.firebasestorage.app",
            messagingSenderId: "98551729936",
            appId: "1:98551729936:web:1f58d33b1585dd4b045f95"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPhotos = [];
        let isAdmin = false;
        let currentPhotoId = null;

        // 평균 고아 점수 계산 헬퍼 함수
        function getAverageScore(scores) {
            if (!scores || scores.length === 0) return 0.0;
            const sum = scores.reduce((a, b) => a + b, 0);
            return (sum / scores.length).toFixed(1);
        }

        // 갤러리 렌더링
        function renderGallery(list) {
            const grid = document.getElementById('galleryGrid');
            const countElem = document.getElementById('totalCount');
            if (countElem) countElem.innerText = `총 사진: ${list.length}장`;

            if (!grid) return;
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<div class="no-data">등록된 사진이 없습니다.</div>';
                return;
            }

            list.forEach(photo => {
                let dateStr = '방금 전';
                if (photo.createdAt && photo.createdAt.toDate) {
                    const d = photo.createdAt.toDate();
                    dateStr = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
                }

                const avgScore = getAverageScore(photo.scores);
                const scoreCount = photo.scores ? photo.scores.length : 0;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrap" data-id="${photo.id}">
                        <img src="${photo.image}" alt="${photo.title}">
                    </div>
                    <div class="card-info">
                        <div class="card-meta">
                            <span class="card-title" title="${photo.title}">${photo.title}</span>
                            <span class="card-date">${dateStr}</span>
                        </div>
                        <div class="card-bottom">
                            <span class="card-score">💀 고아점수: <strong>${avgScore}</strong> (${scoreCount}명)</span>
                            <button class="delete-btn" data-id="${photo.id}">삭제</button>
                        </div>
                    </div>
                `;

                card.querySelector('.card-img-wrap').addEventListener('click', () => {
                    openModal(photo.id);
                });

                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deletePhoto(photo.id);
                });

                grid.appendChild(card);
            });
        }

        // 검색 및 정렬 필터
        function filterAndSortPhotos() {
            const searchInput = document.getElementById('searchInput');
            const sortSelect = document.getElementById('sortSelect');
            
            const keyword = searchInput ? searchInput.value.toLowerCase() : '';
            const sortType = sortSelect ? sortSelect.value : 'latest';

            let filtered = allPhotos.filter(p => p.title.toLowerCase().includes(keyword));

            filtered.sort((a, b) => {
                if (sortType === 'latest') {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                } else if (sortType === 'score') {
                    const scoreA = parseFloat(getAverageScore(a.scores));
                    const scoreB = parseFloat(getAverageScore(b.scores));
                    return scoreB - scoreA;
                }
            });

            renderGallery(filtered);
        }

        window.filterAndSortPhotos = filterAndSortPhotos;

        // 실시간 데이터 동기화
        const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            allPhotos = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                allPhotos.push({ 
                    id: docSnap.id, 
                    ...data,
                    scores: data.scores || [] 
                });
            });
            filterAndSortPhotos();
        });

        // 사진 업로드 (자동 압축 및 리사이징 기능 포함)
        window.uploadPhoto = function() {
            const titleInput = document.getElementById('photoTitle');
            const fileInput = document.getElementById('photoFile');

            const title = titleInput.value.trim();
            if (!title) {
                alert('사진 이름을 입력해 주세요.');
                return;
            }

            if (fileInput.files.length === 0) {
                alert('업로드할 사진 파일을 선택해 주세요.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; // 최대 가로 크기 제한
                    const MAX_HEIGHT = 1000; // 최대 세로 크기 제한
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // JPEG 포맷으로 압축 (품질 0.8 -> 용량이 파이어베이스 제한에 걸리지 않도록 쏙 줄어듦)
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                    addDoc(collection(db, "photos"), {
                        title: title,
                        image: compressedDataUrl,
                        scores: [],
                        createdAt: serverTimestamp()
                    }).then(() => {
                        titleInput.value = '';
                        fileInput.value = '';
                        alert('사진이 성공적으로 등록되었습니다!');
                    }).catch((error) => {
                        alert('업로드 실패: ' + error.message);
                    });
                };
            };

            reader.readAsDataURL(file);
        };

        // 관리자 모드 토글
        window.toggleAdmin = function() {
            if (!isAdmin) {
                const password = prompt('관리자 비밀번호를 입력하세요:');
                if (password === 'guitar0!') { 
                    isAdmin = true;
                    document.body.classList.add('admin-mode');
                    document.getElementById('adminToggleBtn').innerText = '관리자 로그아웃';
                    alert('관리자 모드로 전환되었습니다.');
                } else if (password !== null) {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminToggleBtn').innerText = '관리자 로그인';
                alert('관리자 모드가 해제되었습니다.');
            }
        };

        // 사진 삭제
        function deletePhoto(id) {
            if (!isAdmin) return;
            if (confirm('이 사진을 정말 삭제하시겠습니까?')) {
                deleteDoc(doc(db, "photos", id)).catch((error) => {
                    alert('삭제 실패: ' + error.message);
                });
            }
        }

        // 모달 팝업 관련
        function openModal(photoId) {
            const photo = allPhotos.find(p => p.id === photoId);
            if (!photo) return;

            currentPhotoId = photoId;
            document.getElementById('modalImage').src = photo.image;
            document.getElementById('modalTitle').innerText = photo.title;
            
            const avgScore = getAverageScore(photo.scores);
            const count = photo.scores ? photo.scores.length : 0;
            document.getElementById('modalScoreInfo').innerText = `평균 고아점수: ${avgScore}점 (${count}명 참여)`;
            
            document.getElementById('imageModal').style.display = 'flex';
        }

        window.closeModal = function(event) {
            if (!event || event.target.id === 'imageModal' || event.target.classList.contains('close-btn')) {
                document.getElementById('imageModal').style.display = 'none';
                currentPhotoId = null;
            }
        };

        // 고아 점수 투표 제출 (1~10점)
        window.submitOrphanScore = function(score) {
            if (!currentPhotoId) return;
            const photo = allPhotos.find(p => p.id === currentPhotoId);
            if (!photo) return;

            const updatedScores = [...(photo.scores || []), score];

            updateDoc(doc(db, "photos", currentPhotoId), {
                scores: updatedScores
            }).then(() => {
                alert(`고아점수 ${score}점이 반영되었습니다!`);
                const avg = getAverageScore(updatedScores);
                document.getElementById('modalScoreInfo').innerText = `평균 고아점수: ${avg}점 (${updatedScores.length}명 참여)`;
            }).catch((error) => {
                alert('점수 등록 실패: ' + error.message);
            });
        };

        // 사진 다운로드
        window.downloadPhoto = function() {
            const photo = allPhotos.find(p => p.id === currentPhotoId);
            if (!photo) return;

            const a = document.createElement('a');
            a.href = photo.image;
            a.download = photo.title + '.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>

    <style>
        :root {
            --bg-color: #161412;
            --container-bg: #221f1c;
            --text-color: #d1c7bd;
            --text-muted: #8c8278;
            --border-color: #3b3530;
            --accent-color: #b85d33;
            --accent-hover: #d06d42;
            --danger-color: #a83232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace, sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 4px;
        }

        header {
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #e2d9d0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        .admin-btn-area {
            position: absolute;
            top: 0;
            right: 0;
        }

        button, select {
            background: #2c2723;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button:hover, select:hover {
            background: var(--border-color);
            color: #fff;
        }

        .upload-section {
            background: #1a1715;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 3px;
        }

        .upload-section h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #c5b8ad;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="file"], select {
            background: #12100e;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 2px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        input[type="file"] {
            flex: 1.5;
            min-width: 220px;
            cursor: pointer;
        }

        .upload-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: var(--accent-hover);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 350px;
        }

        .search-box input {
            width: 100%;
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .total-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1a1715;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-color: #554c44;
        }

        .card-img-wrap {
            width: 100%;
            height: 180px;
            background: #111;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) sepia(0.1);
            transition: transform 0.3s;
        }

        .card-img-wrap:hover img {
            transform: scale(1.05);
        }

        .card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #1e1b18;
            border-top: 1px solid var(--border-color);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #dcd0c4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .card-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-score {
            font-size: 0.8rem;
            color: #d09c5d;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 3px 6px;
            font-size: 0.7rem;
            border-radius: 2px;
            display: none;
        }

        .delete-btn:hover {
            background: #c23b3b;
        }

        body.admin-mode .delete-btn {
            display: inline-block;
        }

        .admin-badge {
            background: #5a3232;
            color: #ffcccc;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 2px;
            margin-left: 8px;
            display: none;
        }

        body.admin-mode .admin-badge {
            display: inline-block;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-style: italic;
        }

        /* 라이트박스 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal-content-wrap {
            position: relative;
            max-width: 90%;
            max-height: 85vh;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 4px;
            text-align: center;
        }

        .modal-content-wrap img {
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
            display: block;
            margin-bottom: 10px;
        }

        .modal-title-area {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e2d9d0;
            margin-bottom: 5px;
        }

        .modal-score-info {
            font-size: 0.9rem;
            color: #d09c5d;
            margin-bottom: 12px;
        }

        .vote-section {
            margin-bottom: 15px;
            background: #1a1715;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            width: 100%;
        }

        .vote-label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .vote-buttons {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .vote-btn {
            background: #2c2723;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .vote-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .download-btn {
            background: var(--accent-color);
            color: white;
            border: none;
        }
        .download-btn:hover {
            background: var(--accent-hover);
        }

        .close-btn {
            background: #3b3530;
            color: white;
            border: none;
        }
        .close-btn:hover {
            background: #554c44;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>전민하 갤러리 <span class="admin-badge">ADMIN MODE</span></h1>
            <div class="admin-btn-area">
                <button id="adminToggleBtn" onclick="toggleAdmin()">관리자 로그인</button>
            </div>
        </header>

        <div class="upload-section">
            <h3>+ 사진 아카이브 업로드</h3>
            <div class="form-row">
                <input type="text" id="photoTitle" placeholder="사진 이름 (제목) 입력...">
                <input type="file" id="photoFile" accept="image/*">
                <button class="upload-btn" onclick="uploadPhoto()">업로드</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 사진 이름 검색..." oninput="filterAndSortPhotos()">
            </div>
            <div class="sort-box">
                <select id="sortSelect" onchange="filterAndSortPhotos()">
                    <option value="latest">최신순</option>
                    <option value="score">고아점수 높은순</option>
                </select>
                <div class="total-count" id="totalCount">총 사진: 0장</div>
            </div>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="no-data">데이터를 불러오는 중...</div>
        </div>
    </div>

    <!-- 사진 확대 및 투표 팝업 (라이트박스) -->
    <div id="imageModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content-wrap" onclick="event.stopPropagation()">
            <img id="modalImage" src="" alt="확대된 사진">
            <div class="modal-title-area" id="modalTitle">사진 제목</div>
            <div class="modal-score-info" id="modalScoreInfo">평균 고아점수: 0.0점 (0명 참여)</div>
            
            <div class="vote-section">
                <div class="vote-label">이 사진의 고아점수를 매겨주세요 (1 ~ 10점)</div>
                <div class="vote-buttons">
                    <button class="vote-btn" onclick="submitOrphanScore(1)">1</button>
                    <button class="vote-btn" onclick="submitOrphanScore(2)">2</button>
                    <button class="vote-btn" onclick="submitOrphanScore(3)">3</button>
                    <button class="vote-btn" onclick="submitOrphanScore(4)">4</button>
                    <button class="vote-btn" onclick="submitOrphanScore(5)">5</button>
                    <button class="vote-btn" onclick="submitOrphanScore(6)">6</button>
                    <button class="vote-btn" onclick="submitOrphanScore(7)">7</button>
                    <button class="vote-btn" onclick="submitOrphanScore(8)">8</button>
                    <button class="vote-btn" onclick="submitOrphanScore(9)">9</button>
                    <button class="vote-btn" onclick="submitOrphanScore(10)">10</button>
                </div>
            </div>

            <div class="modal-actions">
                <button class="download-btn" onclick="downloadPhoto()">💾 다운로드</button>
                <button class="close-btn" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

</body>
</html>
